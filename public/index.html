<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus Panel</title>
</head>
<body>
    <h1>Nexus Copier Panel</h1>
    <textarea id="scriptInput" placeholder="Paste your script here..."></textarea>
    <button onclick="sendData()">Submit</button>

    <script>
        async function sendData() {
            const scriptText = document.getElementById('scriptInput').value;
            
            if (!scriptText) {
                alert("Please paste a script first!");
                return;
            }

            // Encode the script to Base64 to match your backend expectation
            const encodedScript = btoa(scriptText);

            try {
                const response = await fetch('https://project-nwb2.onrender.com/api/process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ data: encodedScript })
                });

                const result = await response.json();
                console.log("Success:", result);
                alert("Processed successfully and dispatched to Discord!");
            } catch (error) {
                console.error("Error:", error);
                alert("Failed to connect to backend server.");
            }
        }
    </script>
</body>
</html>
