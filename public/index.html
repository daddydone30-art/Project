<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBX Asset Utility & Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow-btn { transition: all 0.2s ease; box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
        .glow-btn:hover { box-shadow: 0 0 30px rgba(99, 102, 241, 0.4); transform: translateY(-1px); }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse-slow { animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-xl glass-panel rounded-2xl p-8 shadow-2xl relative overflow-hidden">
        <!-- Background Glow Accent -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-400 font-bold text-xl mb-4 border border-indigo-500/20">
                ⚡
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Asset Utility & Exporter</h1>
            <p class="text-sm text-gray-400 mt-1">Paste your asset payload or verification token to process.</p>
        </div>

        <!-- Main Form -->
        <div class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Input Payload / Token</label>
                <textarea id="payloadInput" rows="5" class="w-full bg-gray-900/80 border border-gray-800 rounded-xl p-4 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all font-mono" placeholder="Paste data here..."></textarea>
            </div>

            <button id="submitBtn" onclick="processData()" class="w-full py-4 px-6 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm glow-btn flex items-center justify-center space-x-2">
                <span id="btnText">Process & Extract Asset</span>
                <svg id="spinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </div>

        <!-- Status Toast -->
        <div id="toast" class="hidden mt-6 p-4 rounded-xl text-sm font-medium border text-center transition-all"></div>

        <!-- Footer -->
        <div class="mt-8 pt-6 border-t border-gray-800/60 text-center text-xs text-gray-500 flex items-center justify-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse-slow"></span>
            <span>Studio Engine Online • 2026</span>
        </div>
    </div>

    <script>
        async function processData() {
            const inputVal = document.getElementById('payloadInput').value.trim();
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const toast = document.getElementById('toast');

            if (!inputVal) {
                showToast("Please enter a valid input payload.", "error");
                return;
            }

            // Set loading state
            btn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = "Processing payload...";
            toast.classList.add('hidden');

            try {
                const res = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: inputVal })
                });

                const json = await res.json();

                if (json.success) {
                    showToast("✅ Asset payload processed & dispatched successfully!", "success");
                    document.getElementById('payloadInput').value = '';
                } else {
                    showToast("❌ Error: " + (json.error || "Failed to process request."), "error");
                }
            } catch (err) {
                showToast("❌ Network error connecting to studio backend.", "error");
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
                btnText.textContent = "Process & Extract Asset";
            }
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `mt-6 p-4 rounded-xl text-sm font-medium border text-center transition-all ${
                type === 'success' 
                    ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' 
                    : 'bg-rose-500/10 border-rose-500/20 text-rose-400'
            }`;
            toast.classList.remove('hidden');
        }
    </script>
</body>
</html>
