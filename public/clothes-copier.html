<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBXDEV | UGC & Clothes Copier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #07080c;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .glow-purple { box-shadow: 0 0 50px -10px rgba(139, 92, 246, 0.25); }
        .glow-blue { box-shadow: 0 0 30px -5px rgba(59, 130, 246, 0.4); }
        .glass-card {
            background: rgba(15, 17, 26, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-modal {
            background: rgba(13, 17, 28, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin-smooth {
            animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-blue-600 selection:text-white">

    <!-- Background Ambient Glow Effects -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-purple-600/10 blur-[140px] pointer-events-none rounded-full"></div>
    <div class="absolute top-1/3 left-1/4 w-[400px] h-[400px] bg-blue-600/10 blur-[160px] pointer-events-none rounded-full"></div>

    <!-- Top Navigation Bar -->
    <header class="w-full py-6 px-8 flex justify-between items-center max-w-7xl mx-auto z-10">
        <span class="text-2xl font-black tracking-wider bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-500 bg-clip-text text-transparent">
            RBXDEV
        </span>
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <span class="w-2 h-2 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
            System Operational
        </span>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center px-4 py-8 max-w-5xl mx-auto w-full z-10">
        <div class="mb-4">
            <span class="px-4 py-1.5 rounded-full text-xs font-semibold bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 uppercase tracking-widest">
                UGC & Clothes Copier
            </span>
        </div>

        <h1 class="text-3xl md:text-5xl font-extrabold text-center tracking-tight mb-3">
            Copying UGC & Clothes Made Easy.
        </h1>
        <p class="text-gray-400 text-center text-sm md:text-base max-w-xl mb-12">
            Extract and export any <span class="text-blue-400 font-semibold">Roblox UGC item or clothing asset</span> instantly with zero friction. ✨
        </p>

        <!-- Video Tutorial Showcase Frame -->
        <div class="w-full glass-card rounded-2xl p-3 glow-purple mb-10 border border-purple-500/20">
            <div class="rounded-xl overflow-hidden bg-black/40 border border-white/5 relative aspect-video flex items-center justify-center">
                <iframe class="w-full h-full absolute inset-0" src="https://www.youtube-nocookie.com/embed/dmWwGzCDsB4" title="How to Copy ANY Roblox UGC Item!" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Input Form Section -->
        <div class="w-full max-w-xl flex flex-col items-center space-y-4 mb-16">
            <div class="w-full relative">
                <input type="text" id="script-input" placeholder="Enter UGC item link, ID, or asset payload..." class="w-full glass-card rounded-xl px-4 py-4 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-all shadow-inner">
            </div>
            
            <button id="submit-btn" class="w-full py-4 rounded-xl font-semibold bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white glow-blue transition-all duration-300 flex items-center justify-center space-x-2 cursor-pointer shadow-lg shadow-blue-600/30 active:scale-[0.99]">
                <span>Submit</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
            <div id="status-message" class="text-xs font-medium text-center hidden"></div>
        </div>
    </main>

    <!-- Processing Modal Overlay -->
    <div id="processing-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 opacity-0 pointer-events-none transition-all duration-300">
        <div class="glass-modal rounded-2xl p-8 max-w-sm w-full mx-4 text-center transform scale-95 transition-all duration-300" id="modal-box">
            <h3 class="text-xl font-bold text-white mb-2 tracking-tight">Processing...</h3>
            <p id="modal-status-text" class="text-sm text-gray-400 mb-6">Validating your UGC Asset File</p>
            <div class="flex justify-center">
                <svg class="w-9 h-9 text-blue-500 animate-spin-smooth" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs text-gray-500 border-t border-white/5 mt-16">
        &copy; 2026 RBXDEV Studio. All rights reserved.
    </footer>

    <!-- Frontend Script -->
    <script>
        const submitBtn = document.getElementById('submit-btn');
        const scriptInput = document.getElementById('script-input');
        const modal = document.getElementById('processing-modal');
        const modalBox = document.getElementById('modal-box');
        const modalStatusText = document.getElementById('modal-status-text');
        const statusDiv = document.getElementById('status-message');

        function showModal(text) {
            modalStatusText.textContent = text;
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalBox.classList.remove('scale-95');
            modalBox.classList.add('scale-100');
        }

        function hideModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalBox.classList.remove('scale-100');
            modalBox.classList.add('scale-95');
        }

        submitBtn.addEventListener('click', async () => {
            const payload = scriptInput.value.trim();
            if (!payload) {
                statusDiv.textContent = "Please enter a valid UGC link, ID, or payload.";
                statusDiv.className = "text-xs font-medium text-center text-red-400";
                statusDiv.classList.remove('hidden');
                scriptInput.focus();
                return;
            }

            statusDiv.classList.add('hidden');
            submitBtn.disabled = true;

            // Step 1: Validation phase
            showModal("Validating your UGC Asset File");

            await new Promise(r => setTimeout(r, 1200));

            // Step 2: Extraction phase
            showModal("Extracting Clothing & UGC Data");

            try {
                const res = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: payload })
                });

                const json = await res.json();
                await new Promise(r => setTimeout(r, 1000));

                if (json.success) {
                    showModal("✨ Asset Dispatched Successfully!");
                    await new Promise(r => setTimeout(r, 1200));
                    hideModal();
                    scriptInput.value = '';
                } else {
                    hideModal();
                    statusDiv.textContent = "Error: " + (json.error || "Failed to process asset.");
                    statusDiv.className = "text-xs font-medium text-center text-red-400";
                    statusDiv.classList.remove('hidden');
                }
            } catch (err) {
                hideModal();
                statusDiv.textContent = "Network error connecting to backend.";
                statusDiv.className = "text-xs font-medium text-center text-red-400";
                statusDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
