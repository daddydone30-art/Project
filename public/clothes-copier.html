<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>We're back soon</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--fg:#f1f3ff;--mute:#9aa0bd;--line:rgba(255,255,255,.14);
--a:#00e5ff;--b:#7c5cff;--c:#39ff88;--d:#ff3d6e;
--h:'Rubik',sans-serif;--m:'JetBrains Mono',ui-monospace,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--m);display:grid;place-items:center;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-3;opacity:.45;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000,transparent 70%);mask-image:radial-gradient(circle at 50% 40%,#000,transparent 70%)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
#glow{position:fixed;left:0;top:0;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.25),transparent 65%);pointer-events:none;z-index:-1;transition:transform .3s ease-out}
main{text-align:center;padding:24px;position:relative}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:.75rem;color:var(--c);border:1px solid rgba(57,255,136,.4);background:rgba(57,255,136,.08);padding:7px 16px;border-radius:999px;margin-bottom:26px;animation:pulseTag 2.4s ease-in-out infinite}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
@keyframes pulseTag{50%{box-shadow:0 0 0 6px rgba(57,255,136,0)}}
h1{font-family:var(--h);font-weight:900;letter-spacing:-.04em;font-size:clamp(2.2rem,7vw,4.2rem);margin:0 0 12px;line-height:1}
.g{background:linear-gradient(100deg,var(--a),var(--b) 55%,var(--d));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 5s ease-in-out infinite}
@keyframes shift{50%{background-position:100% 0}}
p.lead{color:var(--mute);margin:0 0 46px;font-size:1.02rem}
.clock{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;perspective:900px}
.unit{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:20px;padding:24px 26px;min-width:108px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 0 50px rgba(0,229,255,.12),inset 0 1px 0 rgba(255,255,255,.08);position:relative;overflow:hidden;transition:transform .2s}
.unit::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 40%)}
.unit b{display:block;font-family:var(--h);font-weight:900;font-size:clamp(2.3rem,7.5vw,3.6rem);line-height:1;position:relative;background:linear-gradient(180deg,var(--fg),var(--mute));-webkit-background-clip:text;background-clip:text;color:transparent}
.unit span{position:relative;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.bar{width:min(90vw,440px);height:7px;border-radius:5px;background:rgba(255,255,255,.08);margin:44px auto 0;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--c),var(--b));background-size:200% 100%;width:0%;transition:width 1s linear;animation:shift 3s linear infinite;box-shadow:0 0 16px var(--a)}
.contact{margin-top:54px;display:flex;flex-direction:column;align-items:center;gap:14px}
.contact p{margin:0;color:var(--mute);font-size:.85rem}
.dc{display:inline-flex;align-items:center;gap:10px;font-family:var(--h);font-weight:800;font-size:1rem;color:#04121a;background:linear-gradient(135deg,var(--b),var(--a));padding:14px 26px;border-radius:14px;box-shadow:0 7px 0 #4a2fb3,0 0 40px rgba(124,92,255,.45);cursor:pointer;border:0;transition:transform .15s,box-shadow .15s;will-change:transform}
.dc:active{transform:translateY(6px);box-shadow:0 1px 0 #4a2fb3}
.dc svg{width:20px;height:20px;fill:#04121a}
.copied{font-size:.72rem;color:var(--c);opacity:0;transition:opacity .3s}
.copied.show{opacity:1}
#dot,#ring{position:fixed;left:0;top:0;pointer-events:none;z-index:60}
#dot{width:8px;height:8px;margin:-4px;background:var(--a);border-radius:2px}
#ring{width:36px;height:36px;margin:-18px;border:1px solid rgba(0,229,255,.6);border-radius:8px;transition:width .25s,height .25s,margin .25s}
#ring.big{width:66px;height:66px;margin:-33px}
@media(hover:none){#dot,#ring{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas><div id="glow"></div><div id="dot"></div><div id="ring"></div>
<main>
  <span class="tag"><i></i>under maintenance</span>
  <h1>We'll be back —<br><span class="g">a lot better.</span></h1>
  <p class="lead">Working on something good. Check back when the timer hits zero.</p>
  <div class="clock">
    <div class="unit"><b id="h">10</b><span>Hours</span></div>
    <div class="unit"><b id="m">00</b><span>Minutes</span></div>
    <div class="unit"><b id="s">00</b><span>Seconds</span></div>
  </div>
  <div class="bar"><i id="fill"></i></div>
  <div class="contact">
    <p>Got questions?</p>
    <button class="dc" id="dcBtn">
      <svg viewBox="0 0 24 24"><path d="M20.3 5.3A17.6 17.6 0 0 0 15.9 4l-.3.6a15 15 0 0 1 3.9 1.4 16 16 0 0 0-13 0 15 15 0 0 1 4-1.4L10.1 4a17.6 17.6 0 0 0-4.4 1.3C2.9 9 2.2 12.6 2.5 16.1A17.8 17.8 0 0 0 7.8 19l.9-1.3a11 11 0 0 1-1.9-.9l.5-.4a12.7 12.7 0 0 0 9.4 0l.5.4a11 11 0 0 1-1.9.9l.9 1.3a17.8 17.8 0 0 0 5.3-2.9c.4-4-.6-7.6-2.2-10.8ZM9.5 14c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Zm5 0c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Z"/></svg>
      Discord: _bfz_
    </button>
    <span class="copied" id="copiedMsg">Copied!</span>
  </div>
</main>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
// floating neon cube background
const cv=document.getElementById('bg'),cx=cv.getContext('2d');let W,H,B=[];
const cols=['#00e5ff','#7c5cff','#39ff88','#ff3d6e'];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;B=[];
 for(let i=0;i<36;i++)B.push({x:Math.random()*W,y:Math.random()*H,s:8+Math.random()*34,r:Math.random()*6,v:(Math.random()-.5)*.004,vy:.15+Math.random()*.3,c:cols[i%4]})}
size();addEventListener('resize',size);
function draw(){cx.clearRect(0,0,W,H);
 for(const b of B){b.y-=b.vy;if(b.y<-40){b.y=H+40;b.x=Math.random()*W}b.r+=b.v;
  cx.save();cx.translate(b.x,b.y);cx.rotate(b.r);cx.globalAlpha=.14;cx.strokeStyle=b.c;cx.fillStyle=b.c;cx.lineWidth=1.5;
  cx.strokeRect(-b.s/2,-b.s/2,b.s,b.s);cx.globalAlpha*=.3;cx.fillRect(-b.s/2,-b.s/2,b.s,b.s);cx.restore()}
 if(!reduce)requestAnimationFrame(draw)}
requestAnimationFrame(draw);
// cursor + glow
const dot=document.getElementById('dot'),ring=document.getElementById('ring'),glow=document.getElementById('glow');
let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;dot.style.transform=`translate(${mx}px,${my}px)`;glow.style.transform=`translate(${mx}px,${my}px)`});
(function f(){rx+=(mx-rx)*.15;ry+=(my-ry)*.15;ring.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(f)})();
document.querySelectorAll('button').forEach(el=>{el.addEventListener('pointerenter',()=>ring.classList.add('big'));el.addEventListener('pointerleave',()=>ring.classList.remove('big'))});
// discord copy
const dcBtn=document.getElementById('dcBtn'),copied=document.getElementById('copiedMsg');
dcBtn.addEventListener('click',async()=>{
 try{await navigator.clipboard.writeText('_bfz_');}catch(e){}
 copied.classList.add('show');setTimeout(()=>copied.classList.remove('show'),1400);
});
// countdown
const TOTAL=10*60*60,end=Date.now()+TOTAL*1000;
const hEl=document.getElementById('h'),mEl=document.getElementById('m'),sEl=document.getElementById('s'),fill=document.getElementById('fill');
function pad(n){return String(n).padStart(2,'0')}
function tick(){
 const left=Math.max(0,Math.round((end-Date.now())/1000));
 const h=Math.floor(left/3600),m=Math.floor((left%3600)/60),s=left%60;
 hEl.textContent=pad(h);mEl.textContent=pad(m);sEl.textContent=pad(s);
 fill.style.width=(100-(left/TOTAL)*100)+'%';
 if(left<=0){document.querySelector('.lead').textContent="We're back!";return}
 setTimeout(tick,250);
}
tick();
</script>
</body>
</html>
