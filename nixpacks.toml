[phases.setup]
nixPkgs = ["nodejs", "python3", "python3Packages.pip", "chromium", "nss", "freetype", "harfbuzz", "ca-certificates", "ttf-dejavu"]

[phases.build]
cmds = [
    "npm install",
    "python3 -m venv venv",
    "./venv/bin/pip install --upgrade pip",
    "./venv/bin/pip install -r requirements.txt",
    "./venv/bin/playwright install chromium"
]

[start]
cmd = "npm start"
